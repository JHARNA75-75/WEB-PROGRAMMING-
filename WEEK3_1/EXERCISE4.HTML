
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      padding: 30px;
    }

    h1 {
      color: #1e293b;
      text-align: center;
    }

    .box {
      width: 250px;
      padding: 25px;
      border: 8px solid #2563eb;
      margin: 30px auto;
      background-color: #bfdbfe;
      text-align: center;
    }

    .explanation {
      max-width: 400px;
      margin: 20px auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>CSS Box Model</h1>

  <div class="box">
    <h2>Content</h2>
    <p>This is the content area.</p>
  </div>

  <div class="explanation">
    <p><strong>Content:</strong> The text or image inside the box.</p>
    <p><strong>Padding:</strong> Space between the content and border.</p>
    <p><strong>Border:</strong> The outline around the box.</p>
    <p><strong>Margin:</strong> Space outside the border.</p>
  </div>
</body>
</html>
