
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fix the Broken CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      padding: 30px;
    }

    h1 {
      color: #15803d;
      text-align: center;
    }

    .card {
      background-color: white;
      color: #334155;
      width: 300px;
      padding: 20px;
      margin: 20px auto;
      border: 2px solid #15803d;
      border-radius: 12px;
    }

    .card p {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>CSS Fixed!</h1>

  <div class="card">
    <h2>My Card</h2>
    <p>The CSS is now correctly written.</p>
    <p>The colors, spacing, and border should display properly.</p>
  </div>
</body>
</html>
