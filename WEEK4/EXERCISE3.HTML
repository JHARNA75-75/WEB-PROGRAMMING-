
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3 - To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: auto;
        }

        h2 { color: #1a56db; }

        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 2px solid #c8d4f0;
            border-radius: 8px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .add-btn {
            background: #1a56db;
            color: white;
        }

        #todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 6px;
            background: #f0f4ff;
            border-radius: 8px;
        }

        .del-btn {
            background: #dc2626;
            color: white;
        }

        #empty-msg {
            color: #9ca3af;
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>My To-Do List</h2>

    <div class="add-row">
        <input id="todo-input" type="text"
               placeholder="Add a task...">
        <button id="add-btn" class="add-btn">+ Add</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-msg">No tasks yet! Add one above.</p>

    <script>
        const input = document.querySelector('#todo-input');
        const addBtn = document.querySelector('#add-btn');
        const list = document.querySelector('#todo-list');
        const emptyMsg = document.querySelector('#empty-msg');

        function updateEmpty() {
            emptyMsg.style.display =
                list.children.length === 0 ? 'block' : 'none';
        }

        function addTask() {
            const text = input.value.trim();

            if (!text) return;

            const li = document.createElement('li');
            li.className = 'todo-item';

            const span = document.createElement('span');
            span.textContent = text;

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '✕';
            deleteBtn.className = 'del-btn';

            li.appendChild(span);
            li.appendChild(deleteBtn);
            list.appendChild(li);

            input.value = '';
            updateEmpty();
        }

        addBtn.addEventListener('click', addTask);

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        list.addEventListener('click', function (e) {
            if (e.target.classList.contains('del-btn')) {
                e.target.closest('li').remove();
                updateEmpty();
            }
        });

        updateEmpty();
    </script>
</body>
</html>
