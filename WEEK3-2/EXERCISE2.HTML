
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hover Card</title>
  <style>
    .card {
      width: 280px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px gray;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 20px teal;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>My Card</h2>
    <p>Hover over this card!</p>
  </div>
</body>
</html>
