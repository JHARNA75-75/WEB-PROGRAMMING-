
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #1e293b;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    border: 2px solid var(--accent);
    padding: 24px;
    border-radius: var(--radius);
    background: var(--bg);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px var(--accent);
  }

  .card[data-icon]::before {
    content: attr(data-icon) '  ';
    font-size: 2rem;
    display: block;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #5eead4;
      --accent: #0f766e;
      --bg: #10201e;
      --text: #f0fdfa;
    }
  }
</style>
</head>
<body>
  <h1>My Skills</h1>
  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>
</body>
</html>
