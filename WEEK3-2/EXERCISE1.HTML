
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Position the Badge</title>
  <style>
    .card {
      position: relative;
      width: 280px;
      height: 180px;
      background: white;
      border: 2px solid teal;
      border-radius: 12px;
      margin: 40px;
    }

    .badge {
      position: absolute;
      top: -12px;
      right: -12px;
      background: teal;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
  </div>
</body>
</html>
