
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validation Styles ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 35px 20px;
    background: #fffcfe;
    color: #593c59;
    font-family: 'Poppins', sans-serif;
}

.container {
    position: relative;
    max-width: 650px;
    margin: 20px auto;
    padding: 40px 32px;
    background: #fbf5fc;
    border: 2px solid #dfc4ed;
    border-radius: 28px;
    box-shadow: 0 18px 45px rgba(112,69,115,.10);
}

.decoration {
    position: absolute;
    color: #bb91c9;
    font-size: 23px;
    letter-spacing: 5px;
}

.top-left {
    top: 12px;
    right: 18px;
}

.bottom-right {
    bottom: 12px;
    right: 18px;
}

h1 {
    margin-bottom: 10px;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(30px, 5vw, 40px);
    font-weight: 400;
    color: #593c59;
}

h1 span {
    color: #cf9ec6;
}

.subtitle {
    margin-bottom: 28px;
    color: #92788f;
    font-size: 14px;
}

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #704f70;
    font-size: 14px;
    font-weight: 600;
}

input {
    display: block;
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #dfc4ed;
    border-radius: 15px;
    outline: none;
    background: #fffafd;
    color: #593c59;
    font: inherit;
    transition: .2s;
}

input::placeholder {
    color: #b49bb1;
}

input:focus {
    border-color: #bd91c9;
    box-shadow: 0 0 0 4px #eadcf2;
}

input.valid {
    border-color: #86b99a;
    background: #f7fff9;
}

input.invalid {
    border-color: #dc91b0;
    background: #fff8fb;
}

.error {
    margin-top: 6px;
    color: #bc527a;
    font-size: 12px;
}

.success {
    margin-top: 18px;
    padding: 14px;
    border: 1px solid #b7d9c1;
    border-radius: 15px;
    background: #f3fff6;
    color: #39734c;
    font-size: 14px;
    line-height: 1.7;
}

button {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 20px;
    background: #e3b9d6;
    color: #583651;
    font: 600 15px 'Poppins', sans-serif;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #d5a6ca;
    transform: translateY(-2px);
}

footer {
    margin-top: 25px;
    color: #b49bb1;
    font-size: 12px;
    text-align: center;
}

[hidden] {
    display: none !important;
}

@media (max-width: 500px) {
    body {
        padding: 15px 12px;
    }

    .container {
        padding: 38px 20px;
    }
}
</style>
</head>

<body>

<main class="container">

    <span class="decoration top-left">✿ ✦</span>

    <h1>Validation Styles <span>♡</span></h1>

    <p class="subtitle">
        Fill in your details and check your information ✨
    </p>

    <form id="validation-form" novalidate>

        <div class="form-group">
            <label for="email">Email (required)</label>
            <input
                id="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
            >
            <p class="error" id="email-error" hidden></p>
        </div>

        <div class="form-group">
            <label for="password">Password (min 8 chars)</label>
            <input
                id="password"
                type="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
                minlength="8"
            >
            <p class="error" id="password-error" hidden></p>
        </div>

        <div class="form-group">
            <label for="age">Age (18–65)</label>
            <input
                id="age"
                type="number"
                placeholder="Your age"
                min="18"
                max="65"
                step="1"
                required
            >
            <p class="error" id="age-error" hidden></p>
        </div>

        <button type="submit">✦ Check Validation</button>

        <div class="success" id="success-message" hidden>
            <strong>Everything looks good! ♡</strong>
            <p>Your email, password, and age passed validation.</p>
        </div>

    </form>

    <span class="decoration bottom-right">✦ ❀</span>

</main>

<footer>Made with ♡ and a little sparkle</footer>

<script>
const form = document.getElementById("validation-form");

const fields = {
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    age: document.getElementById("age")
};

const successMessage = document.getElementById("success-message");

function showError(name, message) {
    const field = fields[name];
    const error = document.getElementById(name + "-error");

    field.classList.remove("valid");
    field.classList.add("invalid");

    error.textContent = message;
    error.hidden = false;
}

function showValid(name) {
    const field = fields[name];
    const error = document.getElementById(name + "-error");

    field.classList.remove("invalid");
    field.classList.add("valid");

    error.textContent = "";
    error.hidden = true;
}

function validateEmail() {
    const value = fields.email.value.trim();

    if (!value) {
        showError("email", "Please enter your email address.");
        return false;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(value)) {
        showError("email", "Please enter a valid email address.");
        return false;
    }

    showValid("email");
    return true;
}

function validatePassword() {
    const value = fields.password.value;

    if (!value) {
        showError("password", "Please enter a password.");
        return false;
    }

    if (value.length < 8) {
        showError("password", "Your password must be at least 8 characters.");
        return false;
    }

    showValid("password");
    return true;
}

function validateAge() {
    const value = fields.age.value.trim();
    const age = Number(value);

    if (!value) {
        showError("age", "Please enter your age.");
        return false;
    }

    if (!Number.isInteger(age) || age < 18 || age > 65) {
        showError("age", "Age must be a whole number from 18 to 65.");
        return false;
    }

    showValid("age");
    return true;
}

fields.email.addEventListener("input", () => {
    validateEmail();
    successMessage.hidden = true;
});

fields.password.addEventListener("input", () => {
    validatePassword();
    successMessage.hidden = true;
});

fields.age.addEventListener("input", () => {
    validateAge();
    successMessage.hidden = true;
});

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const emailOK = validateEmail();
    const passwordOK = validatePassword();
    const ageOK = validateAge();

    if (emailOK && passwordOK && ageOK) {
        successMessage.hidden = false;
    } else {
        successMessage.hidden = true;
    }
});
</script>

</body>
</html>
