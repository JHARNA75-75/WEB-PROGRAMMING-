
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: #fffcfe;
    font-family: 'Poppins', sans-serif;
    color: #593c59;
}

.card {
    position: relative;
    width: 100%;
    max-width: 490px;
    padding: 40px 35px;
    background: #fbf5fc;
    border: 2px solid #dfc4ed;
    border-radius: 28px;
    box-shadow: 0 18px 45px #70457515;
}

.decor {
    position: absolute;
    top: 12px;
    right: 18px;
    color: #bb91c9;
    font-size: 24px;
}

h1 {
    margin: 0 0 30px;
    text-align: center;
    font: 400 38px 'DM Serif Display', Georgia, serif;
}

h1 span { color: #cf9ec6; }

.group { margin-bottom: 22px; }

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #704f70;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #dfc4ed;
    border-radius: 14px;
    background: #fffafd;
    color: #593c59;
    font: inherit;
    outline: none;
}

input:focus {
    border-color: #bd91c9;
    box-shadow: 0 0 0 4px #eadcf2;
}

.remember {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 4px 0 24px;
    font-size: 14px;
}

.remember input { width: auto; accent-color: #bd91c9; }
.remember label { margin: 0; font-weight: 400; }

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 18px;
    background: #e3b9d6;
    color: #583651;
    font: 600 16px 'Poppins', sans-serif;
    cursor: pointer;
}

button:hover { background: #d5a6ca; }

.message {
    margin-top: 18px;
    padding: 12px;
    border-radius: 12px;
    background: #f0e1f5;
    font-size: 13px;
    line-height: 1.7;
}

.register {
    margin-top: 22px;
    text-align: center;
    font-size: 13px;
    color: #92788f;
}

a { color: #96669e; font-weight: 600; }

@media (max-width: 450px) {
    .card { padding: 38px 22px; }
}
</style>
</head>
<body>

<main class="card">
    <span class="decor">✿ ✦</span>
    <h1>Sign In <span>♡</span></h1>

    <form id="signinForm">
        <div class="group">
            <label for="email">Email Address</label>
            <input id="email" type="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="group">
            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter your password" required>
        </div>

        <div class="remember">
            <input id="remember" type="checkbox">
            <label for="remember">Remember me</label>
        </div>

        <button type="submit">♡ Sign In</button>
        <div id="message" class="message" hidden></div>
    </form>

    <p class="register">
        New student?
        <a href="register.html">Create an account</a>
    </p>
</main>

<script>
document.getElementById("signinForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.hidden = false;

    if (password.length < 8) {
        message.textContent = "Please enter a password with at least 8 characters.";
        return;
    }

    message.textContent =
        "Form validated successfully ♡ This demo does not authenticate an account.";
});
</script>

</body>
</html>
