
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seoul Weather ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    gap: 22px;
    background: #fffcfe;
    color: #593c59;
    font-family: 'Poppins', sans-serif;
}

.weather-card {
    position: relative;
    width: 100%;
    max-width: 700px;
    padding: 55px 40px 45px;
    text-align: center;
    background: #fbf5fc;
    border: 2px solid #dfc4ed;
    border-radius: 28px;
    box-shadow: 0 18px 45px #70457319;
}

.decoration {
    position: absolute;
    color: #bb91c9;
    font-size: 25px;
    letter-spacing: 5px;
}

.top-left {
    top: 23px;
    left: 24px;
}

.bottom-right {
    bottom: 20px;
    right: 23px;
}

.eyebrow {
    color: #aa82b6;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(34px, 6vw, 49px);
    font-weight: 400;
}

.heart {
    color: #cf9ec6;
}

.subtitle {
    margin-top: 10px;
    font-size: 14px;
    color: #92788f;
}

.weather-icon {
    margin-top: 22px;
    font-size: 55px;
}

.weather-description {
    color: #92788f;
    font-size: 14px;
    margin-top: 5px;
}

.temperature {
    margin: 8px 0 28px;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(65px, 12vw, 90px);
}

.degree {
    font-size: 35px;
    vertical-align: top;
}

.weather-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
}

.detail {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 12px;
    background: #f0e1f5;
    border-radius: 20px;
    text-align: left;
}

.detail-icon {
    font-size: 27px;
    color: #a87cb8;
}

.detail-label {
    font-size: 11px;
    color: #92788f;
    margin-bottom: 4px;
}

.detail-value {
    font-size: 14px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.status {
    min-height: 20px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #98779b;
}

button {
    border: none;
    border-radius: 30px;
    padding: 16px 28px;
    background: #e3b9d6;
    color: #583651;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    background: #d5a6ca;
    transform: translateY(-3px);
    box-shadow: 0 7px 16px #a671a12e;
}

button:disabled {
    opacity: 0.65;
    cursor: wait;
}

footer {
    font-size: 12px;
    color: #b49bb1;
}

@media (max-width: 480px) {
    .weather-card {
        padding: 55px 20px 40px;
    }

    .weather-details {
        grid-template-columns: 1fr;
    }

    .detail {
        justify-content: flex-start;
        padding-left: 25px;
    }
}
</style>
</head>

<body>

<main class="weather-card">
    <span class="decoration top-left">✿ ✦</span>

    <p class="eyebrow">A LITTLE WEATHER UPDATE</p>

    <h1>Seoul Weather<span class="heart"> ♡</span></h1>
    <p class="subtitle">A little look at the sky in Seoul</p>

    <div class="weather-icon" id="icon">☁</div>
    <p class="weather-description" id="description">Checking the sky...</p>

    <div class="temperature">
        <span id="temperature">--</span><span class="degree">°C</span>
    </div>

    <div class="weather-details">
        <div class="detail">
            <span class="detail-icon">✧</span>
            <div>
                <p class="detail-label">Wind Speed</p>
                <p class="detail-value"><span id="wind">--</span> km/h</p>
            </div>
        </div>

        <div class="detail">
            <span class="detail-icon">❀</span>
            <div>
                <p class="detail-label">Last Updated</p>
                <p class="detail-value" id="updated">--</p>
            </div>
        </div>
    </div>

    <p class="status" id="status">Loading weather ♡</p>

    <button id="refresh">✦ Refresh Weather ✦</button>

    <span class="decoration bottom-right">✦ ❀</span>
</main>

<footer>Made with ♡ and a little bit of sunshine</footer>

<script>
const $ = id => document.getElementById(id);

async function getWeather() {
    const button = $("refresh");
    button.disabled = true;
    button.textContent = "♡ Loading...";

    $("status").textContent = "Getting the latest weather...";

    try {
        const url = "https://api.open-meteo.com/v1/forecast" +
            "?latitude=37.5665&longitude=126.9780" +
            "&current=temperature_2m,wind_speed_10m,weather_code" +
            "&timezone=Asia%2FSeoul";

        const response = await fetch(url);

        if (!response.ok) throw new Error("Weather unavailable");

        const data = await response.json();
        const weather = data.current;

        $("temperature").textContent =
            Number(weather.temperature_2m).toFixed(1);

        $("wind").textContent =
            Number(weather.wind_speed_10m).toFixed(1);

        const conditions = {
            0: ["Clear sky", "☀"],
            1: ["Mainly clear", "🌤"],
            2: ["Partly cloudy", "⛅"],
            3: ["Overcast", "☁"],
            45: ["Foggy", "🌫"],
            48: ["Foggy", "🌫"],
            51: ["Light drizzle", "🌦"],
            53: ["Drizzle", "🌦"],
            55: ["Heavy drizzle", "🌧"],
            61: ["Light rain", "🌧"],
            63: ["Rainy", "🌧"],
            65: ["Heavy rain", "🌧"],
            71: ["Light snow", "🌨"],
            73: ["Snowfall", "❄"],
            75: ["Heavy snow", "❄"],
            80: ["Rain showers", "🌦"],
            81: ["Rain showers", "🌧"],
            82: ["Heavy showers", "🌧"],
            95: ["Thunderstorm", "⛈"],
            96: ["Thunderstorm with hail", "⛈"],
            99: ["Thunderstorm with hail", "⛈"]
        };

        const result = conditions[weather.weather_code] ||
            ["Weather conditions", "☁"];

        $("description").textContent = result[0];
        $("icon").textContent = result[1];

        $("updated").textContent = new Date(weather.time)
            .toLocaleString("en-GB", {
                timeZone: "Asia/Seoul",
                day: "2-digit",
                month: "short",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

        $("status").textContent = "Weather updated successfully ♡";

    } catch (error) {
        $("status").textContent =
            "Couldn't load weather. Please try again.";
        $("description").textContent = "Weather unavailable";
        $("icon").textContent = "☁";

    } finally {
        button.disabled = false;
        button.textContent = "✦ Refresh Weather ✦";
    }
}

$("refresh").addEventListener("click", getWeather);
getWeather();
</script>

</body>
</html>
