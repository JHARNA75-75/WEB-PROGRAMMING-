
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Joke ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background: #fffcfe;
    color: #593c59;
    font-family: 'Poppins', sans-serif;
}

.joke-card {
    position: relative;
    width: 100%;
    max-width: 750px;
    padding: 55px 40px 45px;
    background: #fbf5fc;
    border: 2px solid #dfc4ed;
    border-radius: 28px;
    box-shadow: 0 18px 45px rgba(112, 69, 115, 0.10);
}

.decoration {
    position: absolute;
    color: #bb91c9;
    font-size: 25px;
    letter-spacing: 5px;
}

.top-left {
    top: 20px;
    left: 23px;
}

.bottom-right {
    bottom: 18px;
    right: 23px;
}

h1 {
    margin-bottom: 12px;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(36px, 6vw, 48px);
    font-weight: 400;
    color: #593c59;
}

h1 span {
    color: #cf9ec6;
}

.subtitle {
    margin-bottom: 28px;
    font-size: 14px;
    color: #a184a0;
}

.joke-text {
    min-height: 95px;
    margin-bottom: 30px;
    color: #745670;
    font-size: 16px;
    line-height: 2;
    overflow-wrap: anywhere;
}

.joke-text p + p {
    margin-top: 8px;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 28px;
    background: #e3b9d6;
    color: #583651;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
}

button:hover {
    background: #d5a6ca;
    transform: translateY(-3px);
    box-shadow: 0 7px 16px rgba(166, 113, 161, 0.18);
}

button:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
}

.status {
    min-height: 20px;
    margin-top: 15px;
    font-size: 12px;
    color: #a184a0;
}

footer {
    margin-top: 24px;
    text-align: center;
    color: #b49bb1;
    font-size: 12px;
}

@media (max-width: 480px) {
    body {
        padding: 18px;
    }

    .joke-card {
        padding: 55px 22px 38px;
        border-radius: 24px;
    }

    .joke-text {
        font-size: 15px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<main class="joke-card">
    <span class="decoration top-left">✿ ✦</span>

    <h1>Random Joke <span>♡</span></h1>
    <p class="subtitle">A little laugh for your day ✨</p>

    <div class="joke-text" id="joke">
        <p>A user interface is like a joke.</p>
        <p>If you have to explain it then it is not that good.</p>
    </div>

    <button id="joke-button" type="button">
        ✦ Get another joke ✦
    </button>

    <p class="status" id="status"></p>

    <span class="decoration bottom-right">✦ ❀</span>
</main>

<footer>Made with ♡ and a little laughter</footer>

<script>
const jokeElement = document.getElementById("joke");
const button = document.getElementById("joke-button");
const statusElement = document.getElementById("status");

const backupJokes = [
    {
        setup: "Why don't scientists trust atoms?",
        punchline: "Because they make up everything!"
    },
    {
        setup: "Why did the computer go to the doctor?",
        punchline: "Because it had a virus!"
    },
    {
        setup: "What do you call a sleeping dinosaur?",
        punchline: "A dino-snore!"
    },
    {
        setup: "Why was the math book sad?",
        punchline: "Because it had too many problems!"
    },
    {
        setup: "What do you call cheese that isn't yours?",
        punchline: "Nacho cheese!"
    },
    {
        setup: "Why did the scarecrow win an award?",
        punchline: "Because he was outstanding in his field!"
    },
    {
        setup: "What is a computer's favorite snack?",
        punchline: "Microchips!"
    }
];

let previousJoke = -1;

function showJoke(setup, punchline) {
    jokeElement.replaceChildren();

    const firstLine = document.createElement("p");
    firstLine.textContent = setup;

    const secondLine = document.createElement("p");
    secondLine.textContent = punchline;

    jokeElement.append(firstLine, secondLine);
}

async function getJoke() {
    button.disabled = true;
    button.textContent = "♡ Finding a joke...";
    statusElement.textContent = "";

    try {
        const response = await fetch(
            "https://official-joke-api.appspot.com/random_joke"
        );

        if (!response.ok) {
            throw new Error("Could not load a joke");
        }

        const joke = await response.json();

        if (!joke.setup || !joke.punchline) {
            throw new Error("Invalid joke data");
        }

        showJoke(joke.setup, joke.punchline);

    } catch (error) {
        let index;

        do {
            index = Math.floor(Math.random() * backupJokes.length);
        } while (
            backupJokes.length > 1 && index === previousJoke
        );

        previousJoke = index;

        const joke = backupJokes[index];
        showJoke(joke.setup, joke.punchline);

        statusElement.textContent =
            "Here's a little joke from our collection ♡";

    } finally {
        button.disabled = false;
        button.textContent = "✦ Get another joke ✦";
    }
}

button.addEventListener("click", getJoke);
</script>

</body>
</html>
