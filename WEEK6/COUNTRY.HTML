
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Lookup ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 50px 20px;
    background: #fffcfe;
    color: #593c59;
    font-family: 'Poppins', sans-serif;
}

.container {
    position: relative;
    max-width: 900px;
    margin: auto;
    padding: 45px 35px;
    background: #fbf5fc;
    border: 2px solid #dfc4ed;
    border-radius: 28px;
    box-shadow: 0 18px 45px rgba(112,69,115,.10);
}

.decoration {
    position: absolute;
    color: #bb91c9;
    font-size: 24px;
    letter-spacing: 5px;
}

.top-left { top: 18px; left: 20px; }
.bottom-right { bottom: 15px; right: 20px; }

h1 {
    text-align: center;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(35px, 6vw, 48px);
    font-weight: 400;
    color: #593c59;
}

h1 span { color: #cf9ec6; }

.subtitle {
    margin: 10px 0 30px;
    text-align: center;
    font-size: 14px;
    color: #92788f;
}

.search-box {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px 18px;
    border: 2px solid #dfc4ed;
    border-radius: 18px;
    outline: none;
    background: #fffafd;
    color: #593c59;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
}

input:focus {
    border-color: #bd91c9;
    box-shadow: 0 0 0 4px #eadcf2;
}

button {
    padding: 14px 25px;
    border: none;
    border-radius: 25px;
    background: #e3b9d6;
    color: #583651;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
}

button:hover {
    background: #d5a6ca;
    transform: translateY(-2px);
}

button:disabled {
    opacity: .65;
    cursor: wait;
    transform: none;
}

.message {
    margin: 18px 0;
    color: #92788f;
    font-size: 14px;
}

.results {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.country-card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 22px 20px;
    border: 1.5px solid #e2cdeb;
    border-radius: 22px;
    background: #fffafd;
    box-shadow: 0 5px 18px rgba(112,69,115,.05);
    transition: .25s;
}

.country-card:hover {
    transform: translateY(-3px);
    border-color: #d3addf;
    box-shadow: 0 10px 24px rgba(112,69,115,.10);
}

.flag {
    width: 150px;
    min-width: 100px;
    max-width: 150px;
    height: auto;
    max-height: 100px;
    object-fit: contain;
}

.country-info {
    flex: 1;
    min-width: 0;
}

.country-info h2 {
    margin-bottom: 9px;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(21px, 3vw, 28px);
    font-weight: 400;
    color: #593c59;
    overflow-wrap: anywhere;
}

.country-info p {
    margin: 5px 0;
    color: #826580;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.label {
    color: #b181b5;
    font-weight: 600;
}

.empty {
    padding: 30px 15px;
    text-align: center;
    color: #92788f;
    background: #f6eaf8;
    border-radius: 20px;
}

footer {
    margin-top: 24px;
    text-align: center;
    color: #b49bb1;
    font-size: 12px;
}

@media (max-width: 550px) {
    body { padding: 25px 12px; }

    .container {
        padding: 48px 17px 40px;
        border-radius: 23px;
    }

    .search-box { flex-direction: column; }
    .search-box button { width: 100%; }

    .country-card {
        flex-direction: column;
        text-align: center;
        gap: 15px;
        padding: 22px 14px;
    }

    .flag { width: 130px; }
}
</style>
</head>

<body>

<main class="container">
    <span class="decoration top-left">✿ ✦</span>

    <h1>Country Lookup <span>♡</span></h1>
    <p class="subtitle">Find a country, discover its story ✨</p>

    <form class="search-box" id="search-form">
        <input
            type="text"
            id="country-input"
            placeholder="Enter a country name..."
            value="korea"
            aria-label="Country name"
            required
        >
        <button type="submit" id="search-button">✦ Search</button>
    </form>

    <p class="message" id="message">Loading countries ♡</p>
    <section class="results" id="results"></section>

    <span class="decoration bottom-right">✦ ❀</span>
</main>

<footer>Made with ♡ and a little curiosity</footer>

<script>
const form = document.getElementById("search-form");
const input = document.getElementById("country-input");
const results = document.getElementById("results");
const message = document.getElementById("message");
const button = document.getElementById("search-button");

let allCountries = [];

async function loadCountries() {
    message.textContent = "Loading country information...";

    try {
        const response = await fetch(
            "https://countries.dev/countries?fields=name,alpha2Code,capital,population,flag&sort=name"
        );

        if (!response.ok) {
            throw new Error("Could not load countries.");
        }

        allCountries = await response.json();

        if (!Array.isArray(allCountries) || !allCountries.length) {
            throw new Error("Country data is unavailable.");
        }

        message.textContent = "Search for any country you like ♡";
        searchCountries();

    } catch (error) {
        message.textContent =
            "Unable to load countries. Check your internet and try again.";

        results.replaceChildren();

        const retry = document.createElement("button");
        retry.textContent = "Try Again";
        retry.type = "button";
        retry.addEventListener("click", loadCountries);
        results.appendChild(retry);
    }
}

function searchCountries(event) {
    if (event) event.preventDefault();

    const query = input.value.trim().toLowerCase();

    if (!query) {
        message.textContent = "Please enter a country name ♡";
        results.replaceChildren();
        return;
    }

    if (!allCountries.length) {
        message.textContent = "Country data is still loading...";
        return;
    }

    const matches = allCountries.filter(country =>
        country.name.toLowerCase().includes(query)
    );

    results.replaceChildren();

    if (!matches.length) {
        message.textContent = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
            "No matching countries found ♡ Try another spelling.";
        results.appendChild(empty);
        return;
    }

    message.textContent =
        `Found ${matches.length} matching ${matches.length === 1 ? "country" : "countries"}.`;

    matches.forEach(country => {
        const card = document.createElement("article");
        card.className = "country-card";

        const flag = document.createElement("img");
        flag.className = "flag";
        flag.alt = "Flag of " + country.name;
        flag.loading = "lazy";

        if (country.flag && country.flag.startsWith("https://")) {
            flag.src = country.flag;
        } else if (country.alpha2Code) {
            flag.src = "https://flagcdn.com/w320/" +
                country.alpha2Code.toLowerCase() + ".png";
        } else {
            flag.alt = "Flag unavailable";
        }

        const info = document.createElement("div");
        info.className = "country-info";

        const name = document.createElement("h2");
        name.textContent = country.name;

        const capital = document.createElement("p");
        const capitalLabel = document.createElement("span");
        capitalLabel.className = "label";
        capitalLabel.textContent = "Capital: ";
        capital.append(
            capitalLabel,
            country.capital || "Not available"
        );

        const population = document.createElement("p");
        const populationLabel = document.createElement("span");
        populationLabel.className = "label";
        populationLabel.textContent = "Population: ";

        const populationValue = Number(country.population);
        population.append(
            populationLabel,
            Number.isFinite(populationValue) && populationValue > 0
                ? populationValue.toLocaleString("en-US")
                : "Not available"
        );

        info.append(name, capital, population);
        card.append(flag, info);
        results.appendChild(card);
    });
}

form.addEventListener("submit", searchCountries);
loadCountries();
</script>

</body>
</html>
