
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random User ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    background: #fffcfe;
    color: #593c59;
    font-family: 'Poppins', sans-serif;
}

.container {
    position: relative;
    width: 100%;
    max-width: 850px;
    padding: 55px 30px 40px;
    text-align: center;
    background: #fbf5fc;
    border: 2px solid #dfc4ed;
    border-radius: 28px;
    box-shadow: 0 18px 45px rgba(112,69,115,.10);
}

.decoration {
    position: absolute;
    color: #bb91c9;
    font-size: 25px;
    letter-spacing: 5px;
}

.top-left {
    top: 15px;
    left: 20px;
}

.bottom-right {
    bottom: 12px;
    right: 20px;
}

h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(36px, 6vw, 48px);
    font-weight: 400;
    color: #593c59;
    margin-bottom: 55px;
}

h1 span {
    color: #cf9ec6;
}

.user-photo {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #f0e1f5;
    box-shadow: 0 8px 22px rgba(112,69,115,.12);
    background: #f0e1f5;
    margin-bottom: 25px;
}

.user-name {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 500;
    margin-bottom: 18px;
    color: #593c59;
    overflow-wrap: anywhere;
}

.user-email {
    font-size: 17px;
    color: #826580;
    margin-bottom: 25px;
    overflow-wrap: anywhere;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 17px;
    background: #e3b9d6;
    color: #583651;
    font: 600 16px 'Poppins', sans-serif;
    cursor: pointer;
    transition: .25s;
}

button:hover {
    background: #d5a6ca;
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(112,69,115,.12);
}

button:disabled {
    opacity: .65;
    cursor: wait;
    transform: none;
}

.status {
    margin-top: 18px;
    color: #a17ca7;
    font-size: 13px;
}

footer {
    margin-top: 30px;
    color: #b49bb1;
    font-size: 12px;
}

@media (max-width: 500px) {
    .container {
        padding: 55px 20px 40px;
    }

    h1 {
        margin-bottom: 40px;
    }

    .user-photo {
        width: 140px;
        height: 140px;
    }

    .user-email {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<main class="container">

    <span class="decoration top-left">✿ ✦</span>

    <h1>Random User <span>♡</span></h1>

    <img
        class="user-photo"
        id="user-photo"
        src="https://randomuser.me/api/portraits/women/44.jpg"
        alt="Random person"
    >

    <h2 class="user-name" id="user-name">Loading a lovely person...</h2>

    <p class="user-email" id="user-email">
        Please wait ♡
    </p>

    <button id="user-button" type="button">
        ✦ Get another user
    </button>

    <p class="status" id="status" aria-live="polite"></p>

    <span class="decoration bottom-right">✦ ❀</span>

</main>

<script>
const photo = document.getElementById("user-photo");
const nameElement = document.getElementById("user-name");
const emailElement = document.getElementById("user-email");
const button = document.getElementById("user-button");
const statusElement = document.getElementById("status");

async function getRandomUser() {
    button.disabled = true;
    button.textContent = "Loading... ♡";
    statusElement.textContent = "Finding someone new ✨";

    try {
        const response = await fetch(
            "https://randomuser.me/api/?inc=name,email,picture&nat=us,gb,au,ca&noinfo"
        );

        if (!response.ok) {
            throw new Error("Could not load user");
        }

        const data = await response.json();
        const user = data.results[0];

        const fullName =
            user.name.first + " " + user.name.last;

        // Update the photo only after the new image loads.
        const newPhoto = new Image();

        newPhoto.onload = function() {
            photo.src = newPhoto.src;
            photo.alt = "Photo of " + fullName;
        };

        newPhoto.onerror = function() {
            photo.src =
                "https://randomuser.me/api/portraits/women/44.jpg";
            photo.alt = "Profile photo unavailable";
        };

        newPhoto.src = user.picture.large;

        nameElement.textContent = fullName;
        emailElement.textContent = user.email;

        statusElement.textContent = "A new face, just for you ♡";

    } catch (error) {
        statusElement.textContent =
            "Couldn't load a new user. Please try again ♡";
    } finally {
        button.disabled = false;
        button.textContent = "✦ Get another user";
    }
}

button.addEventListener("click", getRandomUser);

// Load a random user when the website opens.
getRandomUser();
</script>

<footer></footer>

</body>
</html>
